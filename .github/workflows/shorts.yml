name: Instagram to YouTube Shorts

# ---------------------------------------------------------------------------
#  Runs 24x a day (hourly). Each run uploads ONE Short and schedules it at
#  least one hour after the previous publish time - that is what creates the
#  "1 AM, 2 AM, 3 AM ..." ladder. Leftover URLs are simply picked up next hour.
# ---------------------------------------------------------------------------
on:
  # The hourly trigger now lives in Google Apps Script (apps-script/Code.gs),
  # which is more reliable than GitHub's best-effort cron and is never disabled
  # for repo inactivity. Uncomment the two lines below ONLY if you want GitHub
  # itself to trigger too (you would then get two runs per hour).
  # schedule:
  #   - cron: "5 * * * *"
  workflow_dispatch:          # triggered by Apps Script + the manual button
    inputs:
      limit:
        description: "Max uploads this run"
        required: false
        default: "1"
      dry_run:
        description: "Dry run (download + convert only, no upload)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: shorts-uploader     # never let two runs overlap
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ffmpeg ships with the ubuntu-latest runner image. We only fetch a static
      # build if it is missing - NEVER use `apt-get` here: `apt-get update` can
      # block for many minutes on the dpkg lock and looks like a frozen job.
      - name: Ensure ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already installed:"
            ffmpeg -version | head -1
            ffprobe -version | head -1
            exit 0
          fi
          echo "ffmpeg not found - downloading a static build"
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          dir="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -1)"
          sudo install -m755 "$dir/ffmpeg" "$dir/ffprobe" /usr/local/bin/
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        timeout-minutes: 8
        run: pip install --no-input --disable-pip-version-check -r requirements.txt

      - name: Show tool versions
        run: |
          ffmpeg -version | head -1
          python -m yt_dlp --version

      - name: Process queue
        timeout-minutes: 30
        env:
          SHEET_ID:        ${{ secrets.SHEET_ID }}
          GCP_SA_JSON:     ${{ secrets.GCP_SA_JSON }}
          YT_CLIENT_ID:    ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_COOKIES_B64:  ${{ secrets.IG_COOKIES_B64 }}
          HTTP_PROXY_URL:  ${{ secrets.HTTP_PROXY_URL }}
          DAILY_UPLOAD_LIMIT: "6"
          UPLOADS_PER_RUN: ${{ github.event.inputs.limit || '1' }}
          MIN_GAP_MINUTES: "60"
          TIMEZONE: "Asia/Kolkata"
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # optional Instagram cookies (only needed for private/age-gated posts)
          if [ -n "$IG_COOKIES_B64" ]; then
            echo "$IG_COOKIES_B64" | base64 -d > cookies.txt
            export IG_COOKIES_FILE="$PWD/cookies.txt"
          fi

          FLAGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then FLAGS="--dry-run"; fi

          python main.py $FLAGS --limit "$UPLOADS_PER_RUN"

      - name: Cleanup temp files
        if: always()
        timeout-minutes: 2
        run: rm -rf work cookies.txt

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          if-no-files-found: ignore
          retention-days: 7
