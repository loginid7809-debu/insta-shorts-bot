name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ffmpeg is preinstalled on ubuntu-latest; never use apt-get here (it can
      # hang on the dpkg lock). Static build only as a fallback.
      - name: Ensure ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          dir="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -1)"
          sudo install -m755 "$dir/ffmpeg" "$dir/ffprobe" /usr/local/bin/
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          pip install --no-input --disable-pip-version-check -r requirements.txt
          pip install --no-input --disable-pip-version-check -r requirements-dev.txt

      - name: Run test suite
        timeout-minutes: 5
        run: python -m pytest tests -q
